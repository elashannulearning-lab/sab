<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Megu 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#e9d5ff; --g2:#c4a1ff; --g3:#9b6bf2; --g4:#6d3fd1;
  --ink:#ffffff; --glow:rgba(255,255,255,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --g1:#cdb2ff; --g2:#9b6bf2; --g3:#6d3fd1; --g4:#3b1d86; }
}
:root[data-theme="dark"]{ --g1:#cdb2ff; --g2:#9b6bf2; --g3:#6d3fd1; --g4:#3b1d86; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:'Gaegu','Comic Sans MS',cursive,sans-serif;
  background:linear-gradient(160deg,var(--g1),var(--g2) 35%,var(--g3) 70%,var(--g4));
  background-size:200% 200%;animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{to{background-position:100% 100%}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center;padding:16px}

/* tulip */
#bud{cursor:pointer;background:none;border:0;padding:0;width:min(62vw,260px);transition:transform 1.6s cubic-bezier(.5,0,.2,1),opacity 1.4s ease;filter:drop-shadow(0 10px 24px rgba(80,30,160,.45));animation:sway 3.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(2.5deg)}}
#bud.zoom{animation:none;transform:scale(9);opacity:0}
#bud svg{width:100%;height:auto;overflow:visible;display:block}
.p{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.bloom .pl{transform:rotate(-38deg)}
.bloom .pr{transform:rotate(38deg)}
.bloom .pc{transform:scale(1.08)}
.bloom .pbl{transform:rotate(-14deg) scale(1.05)}
.bloom .pbr{transform:rotate(14deg) scale(1.05)}
.hint{margin-top:18px;font-size:1.5rem;font-weight:700;text-shadow:0 2px 12px rgba(80,30,160,.5);animation:pulse 1.8s ease-in-out infinite;transition:opacity .5s}
@keyframes pulse{50%{opacity:.45;transform:scale(1.05)}}

/* text */
#msg{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;line-height:1.3;max-width:90%;min-height:2.6em;display:flex;align-items:center;justify-content:center;text-shadow:0 0 18px var(--glow),0 3px 14px rgba(80,30,160,.55);transition:opacity .8s ease}
#msg.out{opacity:0}
.cur{display:inline-block;width:3px;height:1em;background:#fff;margin-left:4px;vertical-align:-.12em;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* hearts */
#hearts{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(92vw,380px)}
#hearts.show{display:grid}
.h{position:relative;background:none;border:0;padding:0;cursor:pointer;aspect-ratio:1/.92;opacity:0;transform:scale(.2);animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards;filter:drop-shadow(0 8px 16px rgba(80,30,160,.45))}
.h:nth-child(2){animation-delay:.2s}.h:nth-child(3){animation-delay:.4s}.h:nth-child(4){animation-delay:.6s}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.h svg{width:100%;height:100%;display:block;animation:beat 1.6s ease-in-out infinite}
.h:nth-child(2) svg{animation-delay:.25s}.h:nth-child(3) svg{animation-delay:.5s}.h:nth-child(4) svg{animation-delay:.75s}
@keyframes beat{50%{transform:scale(1.07)}}
.h.open svg{animation:none}
.h .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 22% 8%;font-size:clamp(1.3rem,5.6vw,1.9rem);font-weight:700;line-height:1.1;color:#fff;text-shadow:0 2px 8px rgba(80,30,160,.7)}
.h .q{font-size:2rem;opacity:.9}
.h .a{opacity:0;transform:scale(.4);transition:all .6s cubic-bezier(.3,1.6,.5,1)}
.h.open .a{opacity:1;transform:scale(1)}
.h.open .q{display:none}
#end{margin-top:22px;font-size:1.6rem;font-weight:700;opacity:0;transition:opacity 1.4s;text-shadow:0 0 14px var(--glow)}
#end.show{opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage" id="s1">
  <button id="bud" aria-label="Tap the tulip bud">
    <svg viewBox="0 0 200 330">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd1f0"/><stop offset="1" stop-color="#d98bff"/></linearGradient>
        <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b6ff"/><stop offset="1" stop-color="#a45cf0"/></linearGradient>
        <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fe3b5"/><stop offset="1" stop-color="#4fb98a"/></linearGradient>
      </defs>
      <path d="M100 150 C96 210 104 260 100 325" stroke="url(#st)" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M100 280 C60 270 40 235 38 200 C75 210 98 240 100 280Z" fill="url(#st)"/>
      <path d="M101 300 C140 292 162 262 166 230 C128 238 103 262 101 300Z" fill="#6fcf9f"/>
      <g>
        <path class="p pbl" d="M100 160 C62 150 52 100 74 50 C94 78 104 120 100 160Z" fill="url(#pg2)"/>
        <path class="p pbr" d="M100 160 C138 150 148 100 126 50 C106 78 96 120 100 160Z" fill="url(#pg2)"/>
        <path class="p pl" d="M100 165 C58 160 54 105 78 58 C100 90 108 130 100 165Z" fill="url(#pg)"/>
        <path class="p pr" d="M100 165 C142 160 146 105 122 58 C100 90 92 130 100 165Z" fill="url(#pg)"/>
        <path class="p pc" d="M100 168 C72 150 72 100 100 42 C128 100 128 150 100 168Z" fill="url(#pg)" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
      </g>
    </svg>
  </button>
  <div class="hint" id="hint">tap the bud 🌷</div>
</div>

<div class="stage hidden" id="s2">
  <div id="msg"></div>
  <div id="hearts"></div>
  <div id="end">borahae, Megu 💜</div>
</div>

<script>
(function(){
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
let W,H,dpr;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);

const cols=['255,200,236','233,180,255','255,255,255','210,160,255','255,170,210'];
const petals=[],sparks=[];let glitter=false;
function newPetal(top){
  return {x:Math.random()*W,y:top?-20:Math.random()*H,s:6+Math.random()*9,vy:.6+Math.random()*1.1,
    sw:Math.random()*6.28,sv:.01+Math.random()*.02,r:Math.random()*6.28,vr:(Math.random()-.5)*.04,
    f:Math.random()*6.28,c:cols[Math.floor(Math.random()*cols.length)],a:.55+Math.random()*.4};
}
for(let i=0;i<26;i++)petals.push(newPetal(false));

function burst(x,y,n,spread){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*spread)+1;
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.008+Math.random()*.015,s:2+Math.random()*5,t:Math.random()*6.28,g:.02})}
}
function drawStar(x,y,s,a){
  cx.save();cx.translate(x,y);cx.globalAlpha=a;cx.fillStyle='#fff';cx.shadowColor='#fff';cx.shadowBlur=8;
  cx.beginPath();
  for(let i=0;i<8;i++){const r=i%2?s*.25:s,an=i*Math.PI/4;cx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}
  cx.closePath();cx.fill();cx.restore();
}
function frame(){
  cx.clearRect(0,0,W,H);
  for(const p of petals){
    p.y+=p.vy;p.sw+=p.sv;p.x+=Math.sin(p.sw)*.9;p.r+=p.vr;p.f+=.05;
    if(p.y>H+20){Object.assign(p,newPetal(true))}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(Math.cos(p.f)*.6+.5,1);
    cx.globalAlpha=p.a;cx.fillStyle='rgb('+p.c+')';
    const s=p.s;cx.beginPath();cx.moveTo(0,-s);
    cx.bezierCurveTo(s*.9,-s*.6,s*.7,s*.7,0,s);cx.bezierCurveTo(-s*.7,s*.7,-s*.9,-s*.6,0,-s);cx.fill();cx.restore();
  }
  if(glitter&&Math.random()<.5){sparks.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,life:1,d:.012+Math.random()*.01,s:2+Math.random()*4,t:Math.random()*6.28,g:0})}
  for(let i=sparks.length-1;i>=0;i--){
    const q=sparks[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.vx*=.985;q.life-=q.d;q.t+=.2;
    if(q.life<=0){sparks.splice(i,1);continue}
    drawStar(q.x,q.y,q.s*(.6+.4*Math.sin(q.t)),Math.min(1,q.life*1.4));
  }
  requestAnimationFrame(frame);
}
frame();

const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const bud=$('bud'),msg=$('msg');
let started=false;

async function typeText(t,speed){
  msg.classList.remove('out');msg.innerHTML='<span id="tx"></span><span class="cur"></span>';
  const tx=$('tx');
  for(const ch of Array.from(t)){tx.textContent+=ch;await wait(speed+Math.random()*50)}
  await wait(1400);
  msg.classList.add('out');await wait(850);
}

bud.addEventListener('click',async()=>{
  if(started)return;started=true;
  $('hint').style.opacity=0;$('hint').style.animation='none';
  bud.style.animation='none';bud.classList.add('bloom');
  const r=bud.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height*.28,40,5);
  await wait(1200);
  glitter=true;
  bud.classList.add('zoom');
  for(let i=0;i<6;i++){setTimeout(()=>burst(Math.random()*W,Math.random()*H,26,4),i*220)}
  await wait(1500);
  $('s1').classList.add('hidden');$('s2').classList.remove('hidden');
  await wait(400);
  await typeText('Hi Megu...',110);
  await typeText('I wanna tell something about you...',85);
  await typeText('I like your ....',120);
  msg.style.display='none';
  showHearts();
});

const heartSvg='<svg viewBox="0 0 100 92"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9bd8"/><stop offset=".55" stop-color="#b57bff"/><stop offset="1" stop-color="#7a45e0"/></linearGradient></defs><path d="M50 88 C10 58 2 38 6 24 C10 6 36 -2 50 20 C64 -2 90 6 94 24 C98 38 90 58 50 88Z" fill="url(#hg)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><ellipse cx="28" cy="24" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-30 28 24)"/></svg>';
const labels=['Your smile','Your sweetness','Your weird humour','You 🫶🏻'];
function showHearts(){
  const box=$('hearts');box.classList.add('show');let opened=0;
  labels.forEach(l=>{
    const b=document.createElement('button');b.className='h';b.setAttribute('aria-label','Tap the heart');
    b.innerHTML=heartSvg+'<div class="t"><span class="q">💜</span><span class="a"></span></div>';
    b.querySelector('.a').textContent=l;
    b.addEventListener('click',()=>{
      if(b.classList.contains('open'))return;
      b.classList.add('open');opened++;
      const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30,4);
      if(opened===4){setTimeout(()=>{$('end').classList.add('show');for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.8,30,4),i*250)},700)}
    });
    box.appendChild(b);
  });
}
})();
</script>
</body>
</html>
